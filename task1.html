<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 - Responsive Layout with Media Queries</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #2d3748;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 20px;
        }

        .boxes {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .box {
            background-color: #ffffff;
            border-top: 4px solid #0284c7;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .box h3 {
            margin: 0 0 8px 0;
            color: #1e293b;
            font-size: 18px;
        }

        .box p {
            margin: 0;
            font-size: 14px;
            color: #64748b;
        }

        @media (min-width: 600px) {
            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
            }

            .boxes {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 900px) {
            h1 {
                font-size: 34px;
            }

            p {
                font-size: 17px;
            }

            .boxes {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Task 1. Responsive Layout with Media Queries</h1>
        <p><strong>Student:</strong> Aruzhan Abdrakhmanova | <strong>Group:</strong> IT-2501</p>

        <div class="boxes">
            <div class="box">
                <h3>Box 1</h3>
                <p>Pure CSS media queries layout without Bootstrap.</p>
            </div>
            <div class="box">
                <h3>Box 2</h3>
                <p>On tablet screens, two boxes display per row.</p>
            </div>
            <div class="box">
                <h3>Box 3</h3>
                <p>On desktop screens, all three boxes display side by side.</p>
            </div>
        </div>
    </div>

</body>
</html>
