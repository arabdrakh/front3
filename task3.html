<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Bootstrap Navigation Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .navbar-custom {
            background-color: #0f172a;
        }

        h1 {
            font-size: 20px;
            color: #0f172a;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 28px;
            }
        }

        @media (min-width: 992px) {
            h1 {
                font-size: 34px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-md navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="#">Aruzhan</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link active" href="#">Home</a>
                    <a class="nav-link" href="#">About</a>
                    <a class="nav-link" href="#">Projects</a>
                    <a class="nav-link" href="#">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h1 class="mb-2">Task 3. Bootstrap Navigation Bar</h1>
        <p class="text-muted"><strong>Student:</strong> Aruzhan Abdrakhmanova | <strong>Group:</strong> IT-2501</p>
        <p class="text-secondary">
            This navigation bar features a logo on the left, links on the right, and automatically collapses into a hamburger menu on smaller screens below the medium breakpoint (768px).
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
